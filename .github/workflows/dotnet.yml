# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      # The date-versioned release upload at the end of the pipeline
      # (gh release create/upload) needs contents:write.
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install LLVM 22 (clang + llvm tools + dev)
      # EmperorPenguin emits LLVM 22 IR (`#dbg_value` / `#dbg_declare` record form),
      # which needs clang >= 22 to assemble and link. ubuntu-24.04 ships clang-18, so
      # install 22 from the official LLVM apt repo and expose the tools as unversioned
      # names via /usr/local/bin (ahead of /usr/bin on PATH, no system clang clobbering).
      # What make all actually needs beyond clang:
      #   llvm-ar     — C runtime archives (EmperorPenguin/std/c/Makefile defaults AR=llvm-ar)
      #   llvm-config — every bootstrap/LSP/tools link passes -enable-meta, which builds
      #                 libpenguin_jit.a against the host LLVM (llvm-22-dev) and dies
      #                 without llvm-config on PATH (EmperorPenguin/emperor_penguin)
      #   clang++     — compiles penguin_jit.cpp once the JIT is enabled
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo gpg --dearmor --yes -o /usr/share/keyrings/llvm-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
          | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends clang-22 llvm-22 llvm-22-dev
        # Debian/Ubuntu ships versioned tool names (clang++-22, llvm-ar-22,
        # llvm-config-22 in /usr/bin); expose them as the unversioned names the
        # build expects, ahead of /usr/bin on PATH.
        sudo ln -sf /usr/bin/clang-22 /usr/local/bin/clang
        for tool in clang++ llvm-ar llvm-config; do
          src=$(command -v "$tool-22" || command -v "$tool") \
            || { echo "toolchain tool not found: $tool" >&2; exit 1; }
          sudo ln -sf "$src" "/usr/local/bin/$tool"
        done
        clang --version
        clang++ --version
        llvm-ar --version | head -1
        llvm-config --version
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Bootstrap
      # Self-host the compiler: pass1 (dotnet cs backend) -> pass2..pass5
      # (md5 convergence). Everything downstream links through build/bootstrap/*.
      run: make bootstrap
    - name: Build LSP and tools
      # Same phase order as `make all` (bootstrap -> lsp -> tools -> unittest
      # -> test), split into steps so logs and failures stay attributable.
      run: make lsp tools
    - name: Unit tests
      run: make unittest
    - name: Cross-compiler test suite
      # Tests/*.md matrix via PenguinTestRunner; each run writes a
      # self-contained interactive report at build/testruns/<timestamp>/summary.html
      # (uploaded below, also when the suite exits non-zero).
      run: make test
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: build/testruns/*/summary.html
        if-no-files-found: ignore

    # ── release flow (pushes / manual dispatch only, never on PRs) ──────
    # Everything below runs only after the FULL pipeline above succeeded
    # (bootstrap -> lsp/tools -> unittest -> cross-compiler suite).

    - name: Install llvm-mingw cross toolchain
      if: github.event_name != 'pull_request'
      # make publish cross-compiles the windows emitter/LSP/tools
      # (linux -> win) through the emperor_penguin script, which expects the
      # llvm-mingw toolchain at MINGW_PREFIX (default /opt/llvm-mingw).
      # Pinned to the LLVM 22.1.x series the project links against.
      run: |
        wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz
        sudo tar -xf llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz -C /opt
        sudo mv /opt/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64 /opt/llvm-mingw
        /opt/llvm-mingw/bin/x86_64-w64-mingw32-clang --version | head -1
    - name: Install vscode extension dependencies
      if: github.event_name != 'pull_request'
      # make publish ends with `npm run package` in MagellanicPenguin/vscode
      # (cpy / vsce / esbuild come from devDependencies).
      run: npm ci
      working-directory: MagellanicPenguin/vscode
    - name: Publish release artifacts
      if: github.event_name != 'pull_request'
      # Full release flow on top of the passing pipeline: both platforms'
      # emitter + driver script + LSP + tools + dynlib, the self-contained
      # single-file baby_penguin publishes, the vscode extension deploy +
      # smoke tests + vsix. NOTE: thirdparty/mingw-w64-x86_64-llvm-libs (the
      # Windows meta JIT runtime, ~180 MB) is not committed, so the windows
      # emitter links with no-op JIT stubs here — it compiles non-meta
      # programs fine; local `make publish` with the vendored package
      # produces the full-meta binaries.
      run: make publish
    - name: Package release zips
      if: github.event_name != 'pull_request'
      run: |
        VER=$(date -u +%Y%m%d)
        echo "VERSION=$VER" >> "$GITHUB_ENV"
        # The meta-enabled windows emitter loads libLLVM-22.dll at process
        # start; stage the vendored runtime DLLs beside it when the package
        # exists (CI checkouts don't carry thirdparty/ — those win binaries
        # ship with no-op JIT stubs and need no DLLs).
        if [ -f thirdparty/mingw-w64-x86_64-llvm-libs/bin/libLLVM-22.dll ]; then
          cp thirdparty/mingw-w64-x86_64-llvm-libs/bin/*.dll build/win/
        fi
        (cd build && zip -qr "penguinlang-linux-$VER.zip" linux)
        (cd build && zip -qr "penguinlang-win-$VER.zip" win)
        ls -la build/penguinlang-*.zip
    - name: Upload to GitHub release
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="v$VERSION"
        gh release create "$TAG" --title "PenguinLang $TAG" \
            --notes "Automated date-versioned snapshot build (${{ github.sha }})." \
            --target "$GITHUB_SHA" || echo "release $TAG already exists — updating assets"
        gh release upload "$TAG" \
            "build/penguinlang-linux-$VERSION.zip" \
            "build/penguinlang-win-$VERSION.zip" --clobber
        echo "Release: $(gh release view "$TAG" --json url -q .url)"

  deploy-pages:
    # Publish the bilingual documentation site (mdBook, `make docs-site`:
    # English book + Chinese mirror under /zh/ with a toolbar language
    # switcher) plus the latest cross-compiler test report to GitHub Pages.
    # One-shot setup in the repo: Settings -> Pages -> Source = "GitHub
    # Actions". Runs only on pushes / manual dispatch (never on PRs), after
    # build succeeded.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
    - name: Setup mdBook
      uses: peaceiris/actions-mdbook@v2
      with:
        # Pinned so local `make docs-site` verification and CI agree on the
        # generated HTML (the toolbar language switcher relies on it).
        mdbook-version: "0.4.52"
    - name: Build documentation site
      # Root Makefile target: generates each language's Home page from its
      # root README (README.md / README.zh-CN.md, ./docs/<lang>/ links
      # rewritten relative) and builds the English book (book.toml, docs/en)
      # -> build/book plus the Chinese mirror (docs/zh via env overrides)
      # -> build/book-zh.
      run: make docs-site
    - name: Download test report
      uses: actions/download-artifact@v4
      with:
        name: test-report
        path: report
    - name: Stage site
      # English documentation at the root, the Chinese mirror at /zh/, the
      # self-contained report at /test-report/ (both books' sidebar "Test
      # Report" entries link there). The summary lands somewhere under
      # report/ (upload-artifact v4 re-roots the artifact at the least
      # common ancestor of the glob, so the inner path is not stable) —
      # resolve it and publish ONLY the latest testrun (dirs are stamped
      # yyyyMMdd-HHmmss, so lexical order is chronological).
      run: |
        mkdir -p _site/test-report _site/zh
        cp -r build/book/. _site/
        cp -r build/book-zh/. _site/zh/
        summary=$(find report -type f -name summary.html | sort | tail -1)
        [ -n "$summary" ] || { echo "no summary.html found in the test-report artifact" >&2; exit 1; }
        echo "Publishing test report: $summary"
        cp "$summary" _site/test-report/index.html
    - name: Configure Pages
      uses: actions/configure-pages@v5
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
