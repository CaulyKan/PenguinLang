# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install LLVM 22 (clang + llvm tools + dev)
      # EmperorPenguin emits LLVM 22 IR (`#dbg_value` / `#dbg_declare` record form),
      # which needs clang >= 22 to assemble and link. ubuntu-24.04 ships clang-18, so
      # install 22 from the official LLVM apt repo and expose the tools as unversioned
      # names via /usr/local/bin (ahead of /usr/bin on PATH, no system clang clobbering).
      # What make all actually needs beyond clang:
      #   llvm-ar     — C runtime archives (EmperorPenguin/std/c/Makefile defaults AR=llvm-ar)
      #   llvm-config — every bootstrap/LSP/tools link passes -enable-meta, which builds
      #                 libpenguin_jit.a against the host LLVM (llvm-22-dev) and dies
      #                 without llvm-config on PATH (EmperorPenguin/emperor)
      #   clang++     — compiles penguin_jit.cpp once the JIT is enabled
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo gpg --dearmor --yes -o /usr/share/keyrings/llvm-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
          | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends clang-22 llvm-22 llvm-22-dev
        # Debian/Ubuntu ships versioned tool names (clang++-22, llvm-ar-22,
        # llvm-config-22 in /usr/bin); expose them as the unversioned names the
        # build expects, ahead of /usr/bin on PATH.
        sudo ln -sf /usr/bin/clang-22 /usr/local/bin/clang
        for tool in clang++ llvm-ar llvm-config; do
          src=$(command -v "$tool-22" || command -v "$tool") \
            || { echo "toolchain tool not found: $tool" >&2; exit 1; }
          sudo ln -sf "$src" "/usr/local/bin/$tool"
        done
        clang --version
        clang++ --version
        llvm-ar --version | head -1
        llvm-config --version
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Bootstrap
      # Self-host the compiler: pass1 (dotnet cs backend) -> pass2..pass5
      # (md5 convergence). Everything downstream links through build/bootstrap/*.
      run: make bootstrap
    - name: Build LSP and tools
      # Same phase order as `make all` (bootstrap -> lsp -> tools -> unittest
      # -> test), split into steps so logs and failures stay attributable.
      run: make lsp tools
    - name: Unit tests
      run: make unittest
    - name: Cross-compiler test suite
      # Tests/*.md matrix via PenguinTestRunner; each run writes a
      # self-contained interactive report at build/testruns/<timestamp>/summary.html
      # (uploaded below, also when the suite exits non-zero).
      run: make test
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: build/testruns/*/summary.html
        if-no-files-found: ignore

  deploy-pages:
    # Publish the documentation site (mdBook, `make docs-site`) plus the
    # latest cross-compiler test report to GitHub Pages. One-shot setup in
    # the repo: Settings -> Pages -> Source = "GitHub Actions". Runs only
    # on pushes / manual dispatch (never on PRs), after build succeeded.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
    - name: Setup mdBook
      uses: peaceiris/actions-mdbook@v2
      with:
        mdbook-version: latest
    - name: Build documentation site
      # Root Makefile target: rewrites the root README's ./docs/ links to be
      # relative, generates the site Home page from it, and runs mdbook
      # (book.toml, src = docs/) -> build/book.
      run: make docs-site
    - name: Download test report
      uses: actions/download-artifact@v4
      with:
        name: test-report
        path: report
    - name: Stage site
      # Documentation at the root, the self-contained report at /test-report/
      # (the sidebar's "Test Report" entry links there).
      run: |
        mkdir -p _site/test-report
        cp -r build/book/. _site/
        cp report/build/testruns/*/summary.html _site/test-report/index.html
    - name: Configure Pages
      uses: actions/configure-pages@v5
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
